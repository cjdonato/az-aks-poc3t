# Values marked "set by CD" are filled in from Terraform outputs by .github/workflows/cd.yml.

image:
  registry: ""          # set by CD: <acr>.azurecr.io
  tag: latest           # set by CD: git SHA
  pullPolicy: IfNotPresent

frontend:
  replicas: 2
  # nginx forwards /api to this upstream (the backend Service below).
  apiUpstream: http://backend:3000
  service:
    # LoadBalancer gives the frontend a public IP. With gateway.enabled the
    # Gateway is the entry point instead, so the Service stays internal.
    type: LoadBalancer
    port: 80
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 64Mi }

backend:
  replicas: 2
  serviceAccountName: backend    # must match the Terraform federated credential subject
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 192Mi }

postgres:
  host: ""              # set by CD
  adminUser: ""         # set by CD; used only by the db-migrate job
  appUser: app_user     # set by CD; least-privilege login the backend uses
  database: app
  sslMode: require

# Key Vault secrets delivered by the Secrets Store CSI driver using workload identity.
keyVault:
  name: ""              # set by CD
  tenantId: ""          # set by CD
  adminPasswordSecretName: postgres-admin-password
  appPasswordSecretName: postgres-app-password

# Managed identity client IDs (set by CD). Each can read only its own secrets.
workloadIdentity:
  backendClientId: ""   # app password
  migrateClientId: ""   # admin + app passwords

# Pre-install/pre-upgrade hook: applies migrations as the admin and ensures the
# app role (password from Key Vault, DML-only grants).
migrate:
  serviceAccountName: db-migrate   # must match the Terraform federated credential subject
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 192Mi }

# Optional AKS app-routing Gateway API (requires enable_gateway_api in Terraform).
gateway:
  enabled: false
  className: approuting-istio
