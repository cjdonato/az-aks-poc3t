apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    {{- include "poc3t.labels" . | nindent 4 }}
spec:
  type: {{ if .Values.gateway.enabled }}ClusterIP{{ else }}{{ .Values.frontend.service.type }}{{ end }}
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    {{- include "poc3t.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        {{- include "poc3t.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsUser: 101    # "nginx" user in nginx-unprivileged
        runAsGroup: 101
      containers:
        - name: frontend
          image: {{ include "poc3t.image" (list . "frontend") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: API_UPSTREAM
              value: {{ .Values.frontend.apiUpstream | quote }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext:
            {{- include "poc3t.containerSecurityContext" . | nindent 12 }}
