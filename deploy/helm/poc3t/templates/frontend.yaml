{{- if and .Values.frontDoor.enabled .Values.gateway.enabled }}
{{- fail "frontDoor.enabled targets the frontend LoadBalancer; it can't be combined with gateway.enabled" }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    {{- include "poc3t.labels" . | nindent 4 }}
  {{- if and (not .Values.gateway.enabled) (or .Values.frontend.service.dnsLabel .Values.frontDoor.enabled) }}
  annotations:
    {{- with .Values.frontend.service.dnsLabel }}
    service.beta.kubernetes.io/azure-dns-label-name: {{ . | quote }}
    {{- end }}
    {{- if .Values.frontDoor.enabled }}
    # Only Front Door may reach the public IP (Azure NSG rule on the service tag).
    service.beta.kubernetes.io/azure-allowed-service-tags: AzureFrontDoor.Backend
    {{- end }}
  {{- end }}
spec:
  type: {{ if .Values.gateway.enabled }}ClusterIP{{ else }}{{ .Values.frontend.service.type }}{{ end }}
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    {{- include "poc3t.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        {{- include "poc3t.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsUser: 101    # "nginx" user in nginx-unprivileged
        runAsGroup: 101
      containers:
        - name: frontend
          image: {{ include "poc3t.image" (list . "frontend") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: API_UPSTREAM
              value: {{ .Values.frontend.apiUpstream | quote }}
            - name: FRONT_DOOR_ID
              value: {{ if .Values.frontDoor.enabled }}{{ include "poc3t.required" (list .Values.frontDoor.id "frontDoor.id") | quote }}{{ else }}""{{ end }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext:
            {{- include "poc3t.containerSecurityContext" . | nindent 12 }}
