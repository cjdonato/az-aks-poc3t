{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: poc3t
  labels:
    {{- include "poc3t.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: poc3t
  labels:
    {{- include "poc3t.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: poc3t
  rules:
    # API calls go straight to the backend; everything else to the frontend.
    - matches:
        - path: { type: PathPrefix, value: /api }
      backendRefs:
        - name: backend
          port: 3000
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: frontend
          port: {{ .Values.frontend.service.port }}
{{- end }}
