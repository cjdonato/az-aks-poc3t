name: Destroy

# Deletes everything Terraform created in the app resource group (AKS, Postgres,
# ACR, Key Vault, network) to stop costs. The bootstrap resources (state storage,
# CI identity, empty resource group) stay, so the Infra workflow can recreate it all.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "destroy" to delete the environment
        required: true

permissions:
  contents: read

concurrency:
  group: terraform-state
  cancel-in-progress: false

jobs:
  destroy:
    name: Terraform destroy
    if: inputs.confirm == 'destroy'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/terraform-init
        with:
          resource-group: ${{ secrets.TFSTATE_RESOURCE_GROUP }}
          storage-account: ${{ secrets.TFSTATE_STORAGE_ACCOUNT }}
          container: ${{ secrets.TFSTATE_CONTAINER }}
          key: ${{ secrets.TFSTATE_KEY }}
      # Public repo: resource IDs in progress lines are redacted.
      - run: terraform destroy -no-color -auto-approve | sed -E 's/\[id=[^]]*\]/[id=<redacted>]/'
